name = "opencode2"
command = "opencode2"
mode = "pty"
args = ["--standalone"]
auto_args = ["--auto"]
acp_command = "opencode2"
acp_args = ["acp"]

# V2 accepts V1 project configuration, allowing both versions to share a project.
[mcp]
kind = "project"
path = "opencode.json"
format = "opencode"

[state_patterns]
blocked = ["\\(y/n\\)"]
