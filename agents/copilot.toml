name = "copilot"
command = "copilot"
mode = "pty"

[mcp]
kind = "flag"
flag = "--additional-mcp-config"
prefix = "@"

[state_patterns]
blocked = ["\\(y/n\\)", "Do you trust", "Confirm folder trust"]

[quota]
cache_ttl_secs = 900

[[quota.sources]]
kind = "command"
format = "codexbar"
command = "codexbar"
args = ["usage", "--json", "--provider", "copilot"]
