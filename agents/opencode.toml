name = "opencode"
command = "opencode"
mode = "pty"
acp_command = "opencode"
acp_args = ["acp"]

[mcp]
kind = "project"
path = "opencode.json"
format = "opencode"

[state_patterns]
blocked = ["\\(y/n\\)"]

[quota]
source = "command"
format = "codexbar"
command = "codexbar"
args = ["usage", "--json", "--provider", "opencode"]
cache_ttl_secs = 900
