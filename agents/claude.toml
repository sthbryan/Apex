name = "claude"
command = "claude"
mode = "pty"
acp_command = "npx"
acp_args = ["@zed-industries/claude-code-acp"]

[mcp]
kind = "flag"
flag = "--mcp-config"

[state_patterns]
blocked = ["Do you want to proceed", "❯ 1\\. Yes", "\\? for shortcuts"]
done = ["Total cost:"]

[history]
source = "dir"
path = "~/.claude/projects/{project_slug}"
resume_args = ["--resume", "{session_id}"]

[quota]
source = "command"
format = "codexbar"
command = "codexbar"
args = ["usage", "--json", "--provider", "claude"]
cache_ttl_secs = 900
