name = "codex"
command = "codex"
mode = "pty"
acp_command = "npx"
acp_args = ["@zed-industries/codex-acp"]

[env]
TERM = ""

[state_patterns]
blocked = ["\\(y/n\\)", "Allow command", "Do you trust"]

[quota]
source = "command"
format = "codexbar"
command = "codexbar"
args = ["usage", "--json", "--provider", "codex"]
cache_ttl_secs = 900
