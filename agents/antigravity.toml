name = "antigravity"
command = "agy"
mode = "pty"

[mcp]
kind = "shared"
path = "~/.gemini/config/mcp_config.json"

[state_patterns]
blocked = ["\\(y/n\\)", "Allow this", "Approve", "Do you trust"]

[quota]
cache_ttl_secs = 900

[[quota.sources]]
kind = "command"
format = "codexbar"
command = "codexbar"
args = ["usage", "--json", "--provider", "antigravity"]
