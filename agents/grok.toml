name = "grok"
command = "grok"
mode = "pty"

[mcp]
kind = "project"
path = ".grok/config.toml"
format = "grok"

[state_patterns]
blocked = ["\\(y/n\\)", "Allow this", "Approve", "Do you trust"]

[history]
source = "dir"
path = "~/.grok/sessions/{project_encoded}"
entries = "dirs"
label_file = "prompt_history.jsonl"
label_id_key = "session_id"
label_key = "prompt"
resume_args = ["--resume", "{session_id}"]

[quota]
cache_ttl_secs = 900

[[quota.sources]]
kind = "grok_billing"

[[quota.sources]]
kind = "command"
format = "codexbar"
command = "codexbar"
args = ["usage", "--json", "--provider", "grok"]
