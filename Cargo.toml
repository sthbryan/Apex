[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
apex-core = { path = "crates/apex-core" }
apex-proto = { path = "crates/apex-proto" }
apex-metrics = { path = "crates/apex-metrics" }
apex-pty = { path = "crates/apex-pty" }
apex-quota = { path = "crates/apex-quota" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
regex = "1"
futures-util = { version = "0.3", features = ["sink"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
