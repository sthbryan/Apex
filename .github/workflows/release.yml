name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          shared-key: tauri-release

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev

      - name: Generate TS bindings
        run: cargo test -p apex-proto --lib

      - name: Install JS deps
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build apex daemon
        run: |
          cargo build -p apexd --release
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/apexd apps/desktop/src-tauri/binaries/apexd-$(rustc -vV | sed -n 's|host: ||p')
          chmod +x apps/desktop/src-tauri/binaries/apexd-*

      - name: Build, sign and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Apex ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
