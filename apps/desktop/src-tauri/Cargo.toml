[package]
name = "apex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "apex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apex-core.workspace = true
apex-proto.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["image-png", "tray-icon", "unstable"] }
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-dialog = "2.7.2"
url = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-prevent-default = "5"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
window-vibrancy = "0.6"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
webkit2gtk = "2.0"

[lints]
workspace = true

[dev-dependencies]
filetime = "0.2"
tempfile.workspace = true
